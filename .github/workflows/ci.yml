name: verify

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Verify project
        shell: pwsh
        run: ./tools/verify.ps1 -GodotPath (Get-Command godot).Source
