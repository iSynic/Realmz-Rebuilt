name: Native runtime export
description: Installs the pinned scenario importer, builds the cached music importer, verifies decoders, and exports one verified runtime with both importers beside it.
inputs:
  importer-platform:
    description: Scenario importer platform (windows, linux or macos).
    required: true
  importer-url:
    description: Versioned scenario importer archive URL.
    required: true
  importer-sha256:
    description: Expected SHA-256 of the scenario importer archive.
    required: true
  preset:
    description: Godot export preset name.
    required: true
  output:
    description: Export output path.
    required: true
  export-label:
    description: Label shown while the export streams.
    required: true
  missing-importer-message:
    description: Error shown when the importer variables are not configured.
    required: true
runs:
  using: composite
  steps:
    - name: Download verified scenario importer
      shell: pwsh
      env:
        SCENARIO_IMPORTER_URL: ${{ inputs.importer-url }}
        SCENARIO_IMPORTER_SHA256: ${{ inputs.importer-sha256 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SCENARIO_IMPORTER_URL) -or [string]::IsNullOrWhiteSpace($env:SCENARIO_IMPORTER_SHA256)) {
          throw '${{ inputs.missing-importer-message }}'
        }
        $downloadRoot = Join-Path $env:RUNNER_TEMP 'scenario-importer'
        ./tools/install_scenario_importer.ps1 -Url $env:SCENARIO_IMPORTER_URL -ExpectedSha256 $env:SCENARIO_IMPORTER_SHA256 -DestinationRoot $downloadRoot -ExpectedPlatform '${{ inputs.importer-platform }}'
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/music-importer
        key: music-importer-${{ runner.os }}-${{ hashFiles('tools/music_importer/**', 'tools/build_music_importer.ps1', 'tools/package_music_importer.ps1') }}
    - name: Build and package native music importer
      shell: pwsh
      run: |
        $buildRoot = Join-Path $env:RUNNER_TEMP 'music-importer-build'
        $packageRoot = Join-Path $env:RUNNER_TEMP 'music-importer-package'
        if ('${{ runner.os }}' -eq 'macOS') {
          $x64 = Join-Path $buildRoot 'x64'
          $arm64 = Join-Path $buildRoot 'arm64'
          ./tools/build_music_importer.ps1 -Triplet x64-osx -OutputDirectory $x64
          ./tools/build_music_importer.ps1 -Triplet arm64-osx -OutputDirectory $arm64
          ./tools/package_music_importer.ps1 -Target macos-universal -InputDirectory @($x64, $arm64) -OutputDirectory $packageRoot
        } elseif ('${{ runner.os }}' -eq 'Windows') {
          $native = Join-Path $buildRoot 'windows'
          ./tools/build_music_importer.ps1 -Triplet x64-windows-static -OutputDirectory $native
          ./tools/package_music_importer.ps1 -Target windows -InputDirectory $native -OutputDirectory $packageRoot
        } else {
          $native = Join-Path $buildRoot 'linux'
          ./tools/build_music_importer.ps1 -Triplet x64-linux -OutputDirectory $native
          ./tools/package_music_importer.ps1 -Target linux -InputDirectory $native -OutputDirectory $packageRoot
        }
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Verify native music formats
      shell: pwsh
      run: |
        if ($IsMacOS) {
          brew install ffmpeg-full
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the development-only audio fixture tool.' }
          $ffmpegPrefix = brew --prefix ffmpeg-full
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the full audio fixture tool.' }
          $ffmpeg = Join-Path $ffmpegPrefix.Trim() 'bin/ffmpeg'
        } else {
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ($IsWindows) { choco install ffmpeg --yes --no-progress }
            else { sudo apt-get update; sudo apt-get install -y ffmpeg }
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the development-only audio fixture tool.' }
          }
          $ffmpeg = (Get-Command ffmpeg).Source
        }
        $binaryName = 'realmz-music-importer' + $(if ($IsWindows) { '.exe' } else { '' })
        $helper = Join-Path (Join-Path $env:RUNNER_TEMP 'music-importer-package') $binaryName
        $scratch = Join-Path (Get-Location) 'artifacts/music-importer/native-ci'
        python tools/music_importer/test_importer.py --helper $helper --ffmpeg $ffmpeg --scratch $scratch
        if ($LASTEXITCODE -ne 0) { throw 'Native music format verification failed.' }
    - name: Export verified runtime
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path (Split-Path '${{ inputs.output }}') | Out-Null
        $exportLog = Join-Path (Split-Path '${{ inputs.output }}') 'export.log'
        $godotPath = (Get-Command godot).Source
        if ($IsWindows) {
          $windowsGodotPath = Join-Path $env:RUNNER_TEMP 'godot.exe'
          Copy-Item -LiteralPath $godotPath -Destination $windowsGodotPath
          $godotPath = $windowsGodotPath
        }
        . ./tools/stream_process.ps1
        $result = Invoke-StreamingProcess -FilePath $godotPath -ArgumentList @('--headless', '--path', '.', '--export-release', '${{ inputs.preset }}', '${{ inputs.output }}') -Label '${{ inputs.export-label }}'
        [IO.File]::WriteAllLines($exportLog, $result.Output, [Text.UTF8Encoding]::new($false))
        if ($result.ExitCode -ne 0) { throw "Godot export failed with exit code $($result.ExitCode)." }
        $importerSource = Join-Path $env:RUNNER_TEMP 'scenario-importer'
        $musicImporterSource = Join-Path $env:RUNNER_TEMP 'music-importer-package'
        $copyImporter = {
          param([string]$Source, [string]$Destination)
          [IO.Directory]::CreateDirectory($Destination) | Out-Null
          $sourcePrefix = [IO.Path]::GetFullPath($Source).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
          foreach ($file in Get-ChildItem -LiteralPath $Source -File -Recurse -Force) {
            $relative = [IO.Path]::GetFullPath($file.FullName).Substring($sourcePrefix.Length)
            $target = Join-Path $Destination $relative
            [IO.Directory]::CreateDirectory((Split-Path -Parent $target)) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
        }
        if ('${{ runner.os }}' -eq 'macOS') {
          $appStage = Join-Path $env:RUNNER_TEMP 'realmz-rebuilt-importer-stage'
          Expand-Archive -LiteralPath '${{ inputs.output }}' -DestinationPath $appStage
          $app = Join-Path $appStage 'Realmz Rebuilt.app'
          $importerRoot = Join-Path $app 'Contents/MacOS/importer'
          & $copyImporter $importerSource $importerRoot
          chmod 755 (Join-Path $importerRoot 'providence-native-adapter')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS scenario importer executable permissions.' }
          $musicImporterRoot = Join-Path $app 'Contents/MacOS/music-importer'
          & $copyImporter $musicImporterSource $musicImporterRoot
          chmod 755 (Join-Path $musicImporterRoot 'realmz-music-importer')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS music importer executable permissions.' }
          $repacked = Join-Path $env:RUNNER_TEMP 'Realmz-Rebuilt-with-importer.zip'
          & ditto -c -k --sequesterRsrc --keepParent --zlibCompressionLevel 9 $app $repacked
          if ($LASTEXITCODE -ne 0) { throw 'Could not repackage macOS application with its scenario importer.' }
          Move-Item -LiteralPath $repacked -Destination '${{ inputs.output }}' -Force
        } else {
          $importerRoot = Join-Path (Split-Path '${{ inputs.output }}') 'importer'
          $musicImporterRoot = Join-Path (Split-Path '${{ inputs.output }}') 'music-importer'
          & $copyImporter $importerSource $importerRoot
          & $copyImporter $musicImporterSource $musicImporterRoot
          if ('${{ runner.os }}' -eq 'Linux') {
            chmod 755 (Join-Path $importerRoot 'providence-native-adapter')
            if ($LASTEXITCODE -ne 0) { throw 'Could not set Linux scenario importer executable permissions.' }
            chmod 755 (Join-Path $musicImporterRoot 'realmz-music-importer')
            if ($LASTEXITCODE -ne 0) { throw 'Could not set Linux music importer executable permissions.' }
          }
        }
        ./tools/verify_release_artifact.ps1 -Preset '${{ inputs.preset }}' -Output '${{ inputs.output }}' -ExportLog $exportLog -ImporterRoot $importerRoot -MusicImporterRoot $musicImporterRoot -GodotPath $godotPath
