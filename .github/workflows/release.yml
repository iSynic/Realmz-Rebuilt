name: tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Promote verified native artifacts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Package verified preparation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python tools/prepare_release_assets.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --output release
      - name: Inspect existing release state
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $existing = $null
          $page = 1
          do {
            $response = Invoke-WebRequest -Uri "${base}?per_page=100&page=$page" -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -ne 200) { throw "Cannot list tagged releases: HTTP $($response.StatusCode)." }
            $releases = @($response.Content | ConvertFrom-Json)
            $existing = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1
            $page++
          } while ($null -eq $existing -and $releases.Count -eq 100)
          if ($null -eq $existing) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=false'
          } else {
            if ($existing.immutable) { throw 'The existing release is immutable; assets cannot be replaced.' }
            $latest = Invoke-WebRequest -Uri "$base/latest" -Headers $headers -SkipHttpErrorCheck
            if ($latest.StatusCode -notin @(200, 404)) { throw "Cannot inspect Latest release: HTTP $($latest.StatusCode)." }
            $isLatest = $false
            if ($latest.StatusCode -eq 200) { $isLatest = ($latest.Content | ConvertFrom-Json).id -eq $existing.id }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=true'
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "draft=$($existing.draft.ToString().ToLowerInvariant())"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "prerelease=$($existing.prerelease.ToString().ToLowerInvariant())"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "make_latest=$($isLatest.ToString().ToLowerInvariant())"
          }
      - name: Refresh existing release assets
        if: steps.release_state.outputs.exists == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: ${{ steps.release_state.outputs.draft }}
          prerelease: ${{ steps.release_state.outputs.prerelease }}
          make_latest: ${{ steps.release_state.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            release/realmz-rebuilt-windows-x86_64.zip
            release/realmz-rebuilt-linux-x86_64.tar.gz
            release/realmz-rebuilt-macos-universal.zip
            release/SHA256SUMS
      - name: Create draft prerelease
        if: steps.release_state.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Realmz Rebuilt ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/realmz-rebuilt-windows-x86_64.zip
            release/realmz-rebuilt-linux-x86_64.tar.gz
            release/realmz-rebuilt-macos-universal.zip
            release/SHA256SUMS
