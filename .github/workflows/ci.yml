name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Verify project
        shell: pwsh
        run: ./tools/verify.ps1 -GodotPath (Get-Command godot).Source

  export:
    name: Export (${{ matrix.preset }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: Windows Desktop
            output: dist/windows/Realmz Remake 2.0.exe
            artifactPath: dist/windows
            artifact: realmz-remake-2-windows
          - os: ubuntu-latest
            preset: Linux
            output: dist/linux/Realmz Remake 2.0.x86_64
            artifactPath: dist/linux
            artifact: realmz-remake-2-linux
          - os: macos-latest
            preset: macOS
            output: dist/macos/Realmz Remake 2.0.zip
            artifactPath: dist/macos
            artifact: realmz-remake-2-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Export Safe-only runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path '${{ matrix.output }}') | Out-Null
          $exportLog = Join-Path (Split-Path '${{ matrix.output }}') 'export.log'
          $output = & (Get-Command godot).Source --headless --path . --export-release '${{ matrix.preset }}' '${{ matrix.output }}' 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $exportLog
          if ($exitCode -ne 0) { throw "Godot export failed with exit code $exitCode." }
          ./tools/verify_release_artifact.ps1 -Preset '${{ matrix.preset }}' -Output '${{ matrix.output }}' -ExportLog $exportLog
          Remove-Item -LiteralPath $exportLog
      - name: Launch exported Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'realmz-release-windows.log'
          $process = Start-Process -FilePath '${{ matrix.output }}' -ArgumentList @('--headless', '--quit-after', '2', '--log-file', $log) -WindowStyle Hidden -Wait -PassThru
          $content = Get-Content -Raw -LiteralPath $log
          if ($process.ExitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Windows release smoke failed with exit code $($process.ExitCode)." }
      - name: Launch exported Linux runtime
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'realmz-release-linux.log'
          chmod +x '${{ matrix.output }}'
          & './${{ matrix.output }}' --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          $content = Get-Content -Raw -LiteralPath $log
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Linux release smoke failed with exit code $exitCode." }
      - name: Launch exported macOS runtime
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $extracted = Join-Path (Split-Path '${{ matrix.output }}') 'native-smoke'
          $log = Join-Path $env:RUNNER_TEMP 'realmz-release-macos.log'
          Expand-Archive -LiteralPath '${{ matrix.output }}' -DestinationPath $extracted
          $binary = Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/Realmz Rebuilt'
          chmod +x $binary
          & $binary --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          $content = Get-Content -Raw -LiteralPath $log
          Remove-Item -LiteralPath $extracted -Recurse -Force
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "macOS release smoke failed with exit code $exitCode." }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
