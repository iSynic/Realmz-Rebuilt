name: verify

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows x86_64
          - os: ubuntu-latest
            platform: Linux x86_64
          - os: macos-latest
            platform: macOS universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Verify public source and LFS packages
        shell: pwsh
        run: ./tools/verify_public_source.ps1
      - name: Verify project
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          if ($IsWindows) {
            $windowsGodotPath = Join-Path $env:RUNNER_TEMP 'godot.exe'
            Copy-Item -LiteralPath $godotPath -Destination $windowsGodotPath
            $godotPath = $windowsGodotPath
          }
          ./tools/verify.ps1 -GodotPath $godotPath

  export:
    name: Export (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows x86_64
            importerPlatform: windows
            importerUrlVariable: SCENARIO_IMPORTER_WINDOWS_X86_64_URL
            importerHashVariable: SCENARIO_IMPORTER_WINDOWS_X86_64_SHA256
            preset: Windows Desktop
            output: dist/windows/Realmz Rebuilt.exe
            artifactPath: dist/windows
            artifact: realmz-rebuilt-windows-x86_64
          - os: ubuntu-latest
            platform: Linux x86_64
            importerPlatform: linux
            importerUrlVariable: SCENARIO_IMPORTER_LINUX_X86_64_URL
            importerHashVariable: SCENARIO_IMPORTER_LINUX_X86_64_SHA256
            preset: Linux
            output: dist/linux/Realmz Rebuilt.x86_64
            artifactPath: dist/linux
            artifact: realmz-rebuilt-linux-x86_64
          - os: macos-latest
            platform: macOS universal
            importerPlatform: macos
            importerUrlVariable: SCENARIO_IMPORTER_MACOS_URL
            importerHashVariable: SCENARIO_IMPORTER_MACOS_SHA256
            preset: macOS
            output: dist/macos/Realmz Rebuilt.zip
            artifactPath: dist/macos
            artifact: realmz-rebuilt-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Download verified scenario importer
        shell: pwsh
        env:
          SCENARIO_IMPORTER_URL: ${{ vars[matrix.importerUrlVariable] }}
          SCENARIO_IMPORTER_SHA256: ${{ vars[matrix.importerHashVariable] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SCENARIO_IMPORTER_URL) -or [string]::IsNullOrWhiteSpace($env:SCENARIO_IMPORTER_SHA256)) {
            throw 'Set the versioned importer asset URL and SHA-256 repository variables for this platform before exporting.'
          }
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'scenario-importer'
          ./tools/install_scenario_importer.ps1 -Url $env:SCENARIO_IMPORTER_URL -ExpectedSha256 $env:SCENARIO_IMPORTER_SHA256 -DestinationRoot $downloadRoot -ExpectedPlatform '${{ matrix.importerPlatform }}'
      - name: Build and package native music importer
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'music-importer-build'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'music-importer-package'
          if ('${{ runner.os }}' -eq 'macOS') {
            $x64 = Join-Path $buildRoot 'x64'
            $arm64 = Join-Path $buildRoot 'arm64'
            ./tools/build_music_importer.ps1 -Triplet x64-osx -OutputDirectory $x64
            ./tools/build_music_importer.ps1 -Triplet arm64-osx -OutputDirectory $arm64
            ./tools/package_music_importer.ps1 -Target macos-universal -InputDirectory @($x64, $arm64) -OutputDirectory $packageRoot
          } elseif ('${{ runner.os }}' -eq 'Windows') {
            $native = Join-Path $buildRoot 'windows'
            ./tools/build_music_importer.ps1 -Triplet x64-windows-static -OutputDirectory $native
            ./tools/package_music_importer.ps1 -Target windows -InputDirectory $native -OutputDirectory $packageRoot
          } else {
            $native = Join-Path $buildRoot 'linux'
            ./tools/build_music_importer.ps1 -Triplet x64-linux -OutputDirectory $native
            ./tools/package_music_importer.ps1 -Target linux -InputDirectory $native -OutputDirectory $packageRoot
          }
      - name: Verify native music formats
        shell: pwsh
        run: |
          if ($IsMacOS) {
            brew install ffmpeg-full
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the development-only audio fixture tool.' }
            $ffmpegPrefix = brew --prefix ffmpeg-full
            if ($LASTEXITCODE -ne 0) { throw 'Could not locate the full audio fixture tool.' }
            $ffmpeg = Join-Path $ffmpegPrefix.Trim() 'bin/ffmpeg'
          } else {
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              if ($IsWindows) { choco install ffmpeg --yes --no-progress }
              else { sudo apt-get update; sudo apt-get install -y ffmpeg }
              if ($LASTEXITCODE -ne 0) { throw 'Could not install the development-only audio fixture tool.' }
            }
            $ffmpeg = (Get-Command ffmpeg).Source
          }
          $binaryName = 'realmz-music-importer' + $(if ($IsWindows) { '.exe' } else { '' })
          $helper = Join-Path (Join-Path $env:RUNNER_TEMP 'music-importer-package') $binaryName
          $scratch = Join-Path (Get-Location) 'artifacts/music-importer/native-ci'
          python tools/music_importer/test_importer.py --helper $helper --ffmpeg $ffmpeg --scratch $scratch
          if ($LASTEXITCODE -ne 0) { throw 'Native music format verification failed.' }
      - name: Export verified runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path '${{ matrix.output }}') | Out-Null
          $exportLog = Join-Path (Split-Path '${{ matrix.output }}') 'export.log'
          $godotPath = (Get-Command godot).Source
          if ($IsWindows) {
            $windowsGodotPath = Join-Path $env:RUNNER_TEMP 'godot.exe'
            Copy-Item -LiteralPath $godotPath -Destination $windowsGodotPath
            $godotPath = $windowsGodotPath
          }
          . ./tools/stream_process.ps1
          $result = Invoke-StreamingProcess -FilePath $godotPath -ArgumentList @('--headless', '--path', '.', '--export-release', '${{ matrix.preset }}', '${{ matrix.output }}') -Label '${{ matrix.platform }} export'
          [IO.File]::WriteAllLines($exportLog, $result.Output, [Text.UTF8Encoding]::new($false))
          if ($result.ExitCode -ne 0) { throw "Godot export failed with exit code $($result.ExitCode)." }
          $importerSource = Join-Path $env:RUNNER_TEMP 'scenario-importer'
          $musicImporterSource = Join-Path $env:RUNNER_TEMP 'music-importer-package'
          $copyImporter = {
            param([string]$Source, [string]$Destination)
            [IO.Directory]::CreateDirectory($Destination) | Out-Null
            $sourcePrefix = [IO.Path]::GetFullPath($Source).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
            foreach ($file in Get-ChildItem -LiteralPath $Source -File -Recurse -Force) {
              $relative = [IO.Path]::GetFullPath($file.FullName).Substring($sourcePrefix.Length)
              $target = Join-Path $Destination $relative
              [IO.Directory]::CreateDirectory((Split-Path -Parent $target)) | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
          }
          if ('${{ runner.os }}' -eq 'macOS') {
            $appStage = Join-Path $env:RUNNER_TEMP 'realmz-rebuilt-importer-stage'
            Expand-Archive -LiteralPath '${{ matrix.output }}' -DestinationPath $appStage
            $app = Join-Path $appStage 'Realmz Rebuilt.app'
            $importerRoot = Join-Path $app 'Contents/MacOS/importer'
            & $copyImporter $importerSource $importerRoot
            chmod 755 (Join-Path $importerRoot 'providence-native-adapter')
            if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS scenario importer executable permissions.' }
            $musicImporterRoot = Join-Path $app 'Contents/MacOS/music-importer'
            & $copyImporter $musicImporterSource $musicImporterRoot
            chmod 755 (Join-Path $musicImporterRoot 'realmz-music-importer')
            if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS music importer executable permissions.' }
            $repacked = Join-Path $env:RUNNER_TEMP 'Realmz-Rebuilt-with-importer.zip'
            & ditto -c -k --sequesterRsrc --keepParent --zlibCompressionLevel 9 $app $repacked
            if ($LASTEXITCODE -ne 0) { throw 'Could not repackage macOS application with its scenario importer.' }
            Move-Item -LiteralPath $repacked -Destination '${{ matrix.output }}' -Force
          } else {
            $importerRoot = Join-Path (Split-Path '${{ matrix.output }}') 'importer'
            $musicImporterRoot = Join-Path (Split-Path '${{ matrix.output }}') 'music-importer'
            & $copyImporter $importerSource $importerRoot
            & $copyImporter $musicImporterSource $musicImporterRoot
            if ('${{ runner.os }}' -eq 'Linux') {
              chmod 755 (Join-Path $importerRoot 'providence-native-adapter')
              if ($LASTEXITCODE -ne 0) { throw 'Could not set Linux scenario importer executable permissions.' }
              chmod 755 (Join-Path $musicImporterRoot 'realmz-music-importer')
              if ($LASTEXITCODE -ne 0) { throw 'Could not set Linux music importer executable permissions.' }
            }
          }
          ./tools/verify_release_artifact.ps1 -Preset '${{ matrix.preset }}' -Output '${{ matrix.output }}' -ExportLog $exportLog -ImporterRoot $importerRoot -MusicImporterRoot $musicImporterRoot
      - name: Launch exported Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          $quotedLog = '"' + $log + '"'
          $process = Start-Process -FilePath '${{ matrix.output }}' -ArgumentList "--headless --quit-after 2 --log-file $quotedLog" -WindowStyle Hidden -Wait -PassThru
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw 'Windows release smoke did not produce its required log.' }
          $content = Get-Content -Raw -LiteralPath $log
          if ($process.ExitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Windows release smoke failed with exit code $($process.ExitCode)." }
      - name: Launch exported Linux runtime
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          chmod +x '${{ matrix.output }}'
          & './${{ matrix.output }}' --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "Linux release smoke did not produce its required log; exit code $exitCode." }
          $content = Get-Content -Raw -LiteralPath $log
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Linux release smoke failed with exit code $exitCode." }
      - name: Launch exported macOS runtime
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'realmz-rebuilt-native-smoke'
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          Expand-Archive -LiteralPath '${{ matrix.output }}' -DestinationPath $extracted
          $binary = Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/Realmz Rebuilt'
          chmod 755 (Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/importer/providence-native-adapter')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS smoke importer executable permissions.' }
          chmod 755 (Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/music-importer/realmz-music-importer')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS smoke music importer executable permissions.' }
          chmod +x $binary
          & $binary --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "macOS release smoke did not produce its required log; exit code $exitCode." }
          $content = Get-Content -Raw -LiteralPath $log
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "macOS release smoke failed with exit code $exitCode." }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifactPath }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
