name: verify

on:
  push:
    branches: ['release/**']
  pull_request:

permissions:
  contents: read

# The exact preparation commit already passed before main fast-forwards.
# Superseded pull-request and preparation runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows x86_64
          - os: ubuntu-latest
            platform: Linux x86_64
          - os: macos-latest
            platform: macOS universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: ./.github/actions/lfs-pull
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Verify public source and LFS packages
        shell: pwsh
        run: ./tools/verify_public_source.ps1
      - name: Verify project
        shell: pwsh
        run: |
          $godotPath = (Get-Command godot).Source
          if ($IsWindows) {
            $windowsGodotPath = Join-Path $env:RUNNER_TEMP 'godot.exe'
            Copy-Item -LiteralPath $godotPath -Destination $windowsGodotPath
            $godotPath = $windowsGodotPath
          }
          ./tools/verify.ps1 -GodotPath $godotPath

  export:
    name: Export (${{ matrix.platform }})
    needs: verify
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows x86_64
            importerPlatform: windows
            importerUrlVariable: SCENARIO_IMPORTER_WINDOWS_X86_64_URL
            importerHashVariable: SCENARIO_IMPORTER_WINDOWS_X86_64_SHA256
            preset: Windows Desktop
            output: dist/windows/Realmz Rebuilt.exe
            artifactPath: dist/windows
            artifact: realmz-rebuilt-windows-x86_64
          - os: ubuntu-latest
            platform: Linux x86_64
            importerPlatform: linux
            importerUrlVariable: SCENARIO_IMPORTER_LINUX_X86_64_URL
            importerHashVariable: SCENARIO_IMPORTER_LINUX_X86_64_SHA256
            preset: Linux
            output: dist/linux/Realmz Rebuilt.x86_64
            artifactPath: dist/linux
            artifact: realmz-rebuilt-linux-x86_64
          - os: macos-latest
            platform: macOS universal
            importerPlatform: macos
            importerUrlVariable: SCENARIO_IMPORTER_MACOS_URL
            importerHashVariable: SCENARIO_IMPORTER_MACOS_SHA256
            preset: macOS
            output: dist/macos/Realmz Rebuilt.zip
            artifactPath: dist/macos
            artifact: realmz-rebuilt-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: ./.github/actions/lfs-pull
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: ./.github/actions/native-runtime
        with:
          importer-platform: ${{ matrix.importerPlatform }}
          importer-url: ${{ vars[matrix.importerUrlVariable] }}
          importer-sha256: ${{ vars[matrix.importerHashVariable] }}
          preset: ${{ matrix.preset }}
          output: ${{ matrix.output }}
          export-label: ${{ matrix.platform }} export
          missing-importer-message: Set the versioned importer asset URL and SHA-256 repository variables for this platform before exporting.
      - name: Launch exported Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          $quotedLog = '"' + $log + '"'
          $process = Start-Process -FilePath '${{ matrix.output }}' -ArgumentList "--headless --quit-after 2 --log-file $quotedLog" -WindowStyle Hidden -Wait -PassThru
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw 'Windows release smoke did not produce its required log.' }
          $content = Get-Content -Raw -LiteralPath $log
          if ($process.ExitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Windows release smoke failed with exit code $($process.ExitCode)." }
      - name: Launch exported Linux runtime
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          chmod +x '${{ matrix.output }}'
          & './${{ matrix.output }}' --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "Linux release smoke did not produce its required log; exit code $exitCode." }
          $content = Get-Content -Raw -LiteralPath $log
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "Linux release smoke failed with exit code $exitCode." }
      - name: Launch exported macOS runtime
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'realmz-rebuilt-native-smoke'
          $log = Join-Path (Resolve-Path -LiteralPath '${{ matrix.artifactPath }}').Path 'smoke.log'
          Expand-Archive -LiteralPath '${{ matrix.output }}' -DestinationPath $extracted
          $binary = Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/Realmz Rebuilt'
          chmod 755 (Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/importer/providence-native-adapter')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS smoke importer executable permissions.' }
          chmod 755 (Join-Path $extracted 'Realmz Rebuilt.app/Contents/MacOS/music-importer/realmz-music-importer')
          if ($LASTEXITCODE -ne 0) { throw 'Could not set macOS smoke music importer executable permissions.' }
          chmod +x $binary
          & $binary --headless --quit-after 2 --log-file $log
          $exitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "macOS release smoke did not produce its required log; exit code $exitCode." }
          $content = Get-Content -Raw -LiteralPath $log
          if ($exitCode -ne 0 -or $content -match '(?m)^(?:ERROR|SCRIPT ERROR):') { throw "macOS release smoke failed with exit code $exitCode." }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifactPath }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  runtime-testing:
    name: Runtime testing tools
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/runtime_testing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/runtime_testing/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
